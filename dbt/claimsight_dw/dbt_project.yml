name: "claimsight_dw"
version: "1.0.0"
config-version: 2

profile: "claimsight_dw"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Layered materialisation strategy:
#   staging      -> views  (light renaming/casting over raw)
#   intermediate -> ephemeral (cleaning / dedup, compiled inline)
#   marts        -> tables  (the star schema consumed by BI)
models:
  claimsight_dw:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: ephemeral
    marts:
      +schema: marts
      +materialized: table

vars:
  # End of the simulation window; used for age / current-flag logic.
  window_end: "2026-06-30"
