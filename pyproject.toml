[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimsight"
version = "0.1.0"
description = "Healthcare TPA claims analytics & BI platform (synthetic Pakistani data)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/claimsight"]
omit = ["*/pipeline.py"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # long SQL/format strings are fine

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"dashboard/*" = ["E402"]
